<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bennethogan.dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
  <style>
    body {
      background: #111111;
      color: #cccccc;
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      line-height: 2;
      margin: 0;
      padding: 200px 40px 40px 40px;
    }

    #columns {
      display: flex;
      align-items: flex-start;
      gap: 48px;
      min-width: 400px
      max-width: 900px;
    }

    #text {
      flex: 1;
    }

    #photo img {
      width: 640px;
      border-radius: 8px;
      display: block;
    }

    a {
      color: #ffdd44;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div id="columns">
    <div id="text">
      <p>My name is Bennet. Welcome to my website.<br>
         Right now, all this is used for is a wiki for my Minecraft mod.</p>

      <br>

      <p>You can download that mod here:<br>
      <a href="https://modrinth.com/mod/universal-keyboard">https://modrinth.com/mod/universal-keyboard</a></p>

      <br>

      <p>And view the wiki by clicking <a href="/universalkeyboard/wiki/">[here]</a></p>

      <br>

      <p>If you have questions about my mod, please join my Discord server <a href="https://discord.gg/Gj4fw2A3uZ">[here]</a></p>
    </div>

    <div id="photo">
      <img src="/universalkeyboard/mycat.jpg" alt="My cat" width="640" height="360">
    </div>
  </div>

</body>
</html>
