plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.26'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    maven {
        url "https://maven.squiddev.cc"
        content { includeGroup("cc.tweaked") }
    }
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.ithundxr.dev/snapshots" }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // CC:Tweaked — optional at runtime, needed at compile time for KeyboardPeripheral
    compileOnly "cc.tweaked:cc-tweaked-1.21.1-core-api:${cc_version}"

    // Create — optional at runtime, accessed entirely via reflection (compileOnly for IDE support)
    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    compileOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    compileOnly("com.tterrag.registrate:Registrate:${registrate_version}")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    var replaceProperties = [
        mod_id       : mod_id,       mod_name    : mod_name,
        mod_version  : mod_version,  mod_license : mod_license,
        mod_group_id : mod_group_id
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }

    // Ship es_es.json under every supported Spanish locale without keeping
    // duplicate files in the repo. The translator maintains only es_es.json.
    def spanishLangDir = 'assets/universalkeyboard/lang'
    def esSource = file("src/main/resources/${spanishLangDir}/es_es.json")
    ['es_mx', 'es_ar', 'es_cl', 'es_uy', 'es_ve', 'es_ec'].each { locale ->
        from(esSource) {
            into spanishLangDir
            rename { "${locale}.json" }
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
